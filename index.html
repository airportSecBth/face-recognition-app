<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Pro</title>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

*{box-sizing:border-box;}

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:500px;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.video-wrapper{
position:relative;
flex:1;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
border-radius:20px;
background:black;
transform:scaleX(-1);
}

.face-frame{
position:absolute;
width:220px;
height:280px;
border:3px solid #00e5ff;
border-radius:20px;
pointer-events:none;
box-shadow:0 0 25px #00e5ff;
transition:0.3s;
display:flex;
justify-content:center;
align-items:flex-end;
}

.face-frame.active{
border:3px solid #00ff7b;
box-shadow:0 0 25px #00ff7b;
}

.frame-info{
position:absolute;
bottom:10px;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
font-size:13px;
background:rgba(0,0,0,0.6);
padding:6px 10px;
border-radius:10px;
border:1px solid #00e5ff;
}

#confidenceBox{
font-weight:bold;
}

/* COLOR CONFIDENCE */

.conf-red{
color:#ff4d4d;
}

.conf-yellow{
color:#ffd43b;
}

.conf-green{
color:#00ff7b;
}

#detectStatus{
font-size:12px;
color:#cbd5f5;
}

.result-box{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.85);
padding:10px 20px;
border-radius:12px;
font-weight:bold;
font-size:16px;
border:2px solid #00e5ff;
z-index:10;
display:none;
white-space:nowrap;
}

.result-success{
border-color:#00ff7b;
color:#00ff7b;
}

.result-fail{
border-color:#ff4d4d;
color:#ff4d4d;
}

.loading-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.spinner{
width:60px;
height:60px;
border:6px solid rgba(255,255,255,0.2);
border-top:6px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="loading-overlay" id="loading">
<div class="spinner"></div>
<div id="loadingText">Processing...</div>
</div>

<div class="app">

<div class="header">Face Recognition Pro</div>

<div class="video-wrapper">

<div id="resultBox" class="result-box"></div>

<video id="video" autoplay muted playsinline></video>

<div class="face-frame" id="faceFrame">

<div class="frame-info">
<div id="confidenceBox">Confidence 0%</div>
<div id="detectStatus">Tidak ada wajah</div>
</div>

</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const faceFrame=document.getElementById("faceFrame");
const confidenceBox=document.getElementById("confidenceBox");
const detectStatus=document.getElementById("detectStatus");
const resultBox=document.getElementById("resultBox");

const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");

const GAS_URL="https://script.google.com/macros/s/AKfycbwvBwwb_H4yp2gE6k97yabfPHAgd-IhLZMfVeX6iaqE6KUlxltdHCTGpc0tM9cIY6rj/exec";
const MODEL_URL="./models";

let database=[];
let verifying=false;
let faceDetected=false;

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{video.srcObject=stream;});

function showResult(text,type){

resultBox.style.display="block";
resultBox.innerText=text;

resultBox.classList.remove("result-success","result-fail");

if(type==="success") resultBox.classList.add("result-success");
if(type==="fail") resultBox.classList.add("result-fail");

setTimeout(()=>{resultBox.style.display="none";},3000);

}

function showLoading(text){
loading.style.display="flex";
loadingText.innerText=text;
}

function hideLoading(){
loading.style.display="none";
}

async function loadModels(){

await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

let response=await fetch(GAS_URL);
database=await response.json();

startFaceDetection();

}

loadModels();

/* FAST DETECTOR */

const detectorOptions=
new faceapi.TinyFaceDetectorOptions({
inputSize:128,
scoreThreshold:0.5
});

async function startFaceDetection(){

setInterval(async()=>{

if(verifying) return;

const detection=await faceapi.detectSingleFace(
video,
detectorOptions
);

if(detection){

faceDetected=true;

faceFrame.classList.add("active");

const percent=Math.round(detection.score*100);

confidenceBox.innerText="Confidence "+percent+"%";
detectStatus.innerText="Wajah terdeteksi";

/* RESET COLOR */

confidenceBox.classList.remove(
"conf-red",
"conf-yellow",
"conf-green"
);

/* COLOR SYSTEM */

if(percent<60){

confidenceBox.classList.add("conf-red");

}
else if(percent<80){

confidenceBox.classList.add("conf-yellow");

}
else{

confidenceBox.classList.add("conf-green");

}

/* AUTO VERIFY */

if(percent>85){

autoVerify();

}

}else{

faceDetected=false;

faceFrame.classList.remove("active");

confidenceBox.innerText="Confidence 0%";
detectStatus.innerText="Tidak ada wajah";

confidenceBox.classList.remove(
"conf-red",
"conf-yellow",
"conf-green"
);

}

},70); /* SUPER FAST SCAN */

}

async function getDescriptor(){

const detection=await faceapi
.detectSingleFace(video,detectorOptions)
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection) return null;

return Array.from(detection.descriptor);

}

function euclideanDistance(d1,d2){

let sum=0;

for(let i=0;i<d1.length;i++){
sum+=Math.pow(d1[i]-d2[i],2);
}

return Math.sqrt(sum);

}

async function autoVerify(){

if(verifying) return;

verifying=true;

detectStatus.innerText="Memverifikasi...";

const descriptor=await getDescriptor();

if(!descriptor){
verifying=false;
return;
}

let bestMatch=null;
let minDistance=999;

database.forEach(user=>{

const distance=euclideanDistance(descriptor,user.descriptor);

if(distance<minDistance){
minDistance=distance;
bestMatch=user.nama;
}

});

if(minDistance<0.6){

showResult("MATCH : "+bestMatch,"success");

}else{

showResult("Wajah tidak dikenali","fail");

}

setTimeout(()=>{
verifying=false;
},3000);

}

</script>

</body>
</html>
