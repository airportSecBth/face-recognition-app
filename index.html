<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Pro</title>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

*{box-sizing:border-box;}

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:500px;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

/* TAB */

.tabs{
display:flex;
background:#020617;
}

.tab{
flex:1;
padding:15px;
text-align:center;
cursor:pointer;
border-bottom:3px solid transparent;
}

.tab.active{
border-bottom:3px solid #00e5ff;
background:#111827;
}

/* VIDEO */

.video-wrapper{
position:relative;
flex:1;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
border-radius:20px;
background:black;
transform:scaleX(-1);
}

/* FRAME */

.face-frame{
position:absolute;
width:220px;
height:280px;
border:3px solid #00e5ff;
border-radius:20px;
pointer-events:none;
box-shadow:0 0 25px #00e5ff;
transition:0.3s;
}

.face-frame.active{
border:3px solid #00ff7b;
box-shadow:0 0 25px #00ff7b;
}

/* CONFIDENCE */

.confidence{
position:absolute;
top:calc(50% + 160px);
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.6);
padding:8px 14px;
border-radius:10px;
font-size:14px;
font-weight:bold;
border:1px solid #00e5ff;
}

/* STATUS */

.detect-status{
position:absolute;
top:calc(50% + 200px);
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.6);
padding:6px 12px;
border-radius:10px;
font-size:13px;
border:1px solid #64748b;
}

/* RESULT */

.result-box{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.85);
padding:10px 20px;
border-radius:12px;
font-weight:bold;
font-size:16px;
border:2px solid #00e5ff;
z-index:10;
display:none;
white-space:nowrap;
}

.result-success{
border-color:#00ff7b;
color:#00ff7b;
}

.result-fail{
border-color:#ff4d4d;
color:#ff4d4d;
}

/* CONTROLS */

.controls{
padding:20px;
background:#111827;
border-top-left-radius:25px;
border-top-right-radius:25px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
margin-bottom:10px;
cursor:pointer;
}

.enroll{background:#00c853;color:white;}
.verify{background:#2962ff;color:white;}

.status{
text-align:center;
margin-top:10px;
font-weight:bold;
min-height:24px;
}

</style>
</head>

<body>

<div class="app">

<div class="header">Face Recognition Pro</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('verify')" id="tabVerify">Verifikasi</div>
<div class="tab" onclick="switchTab('enroll')" id="tabEnroll">Tambah Wajah</div>
</div>

<div class="video-wrapper">

<div id="resultBox" class="result-box"></div>

<video id="video" autoplay muted playsinline></video>

<div class="face-frame" id="faceFrame"></div>

<div class="confidence" id="confidenceBox">Confidence 0%</div>
<div class="detect-status" id="detectStatus">Menunggu kamera...</div>

</div>

<div class="controls">

<div id="verifySection">
<button class="verify" onclick="verify()">Verifikasi Wajah</button>
</div>

<div id="enrollSection" style="display:none;">
<input type="text" id="nama" placeholder="Masukkan Nama">
<button class="enroll" onclick="enroll()">Tambah Wajah</button>
</div>

<div class="status" id="status">Loading model...</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const statusText=document.getElementById("status");

const faceFrame=document.getElementById("faceFrame");
const confidenceBox=document.getElementById("confidenceBox");
const detectStatus=document.getElementById("detectStatus");

const resultBox=document.getElementById("resultBox");

const verifySection=document.getElementById("verifySection");
const enrollSection=document.getElementById("enrollSection");

const tabVerify=document.getElementById("tabVerify");
const tabEnroll=document.getElementById("tabEnroll");

const GAS_URL="https://script.google.com/macros/s/AKfycbwvBwwb_H4yp2gE6k97yabfPHAgd-IhLZMfVeX6iaqE6KUlxltdHCTGpc0tM9cIY6rj/exec";
const MODEL_URL="./models";

/* TAB */

function switchTab(tab){

if(tab==="verify"){

verifySection.style.display="block";
enrollSection.style.display="none";

tabVerify.classList.add("active");
tabEnroll.classList.remove("active");

}else{

verifySection.style.display="none";
enrollSection.style.display="block";

tabVerify.classList.remove("active");
tabEnroll.classList.add("active");

}

}

/* RESULT */

function showResult(text,type){

resultBox.style.display="block";
resultBox.innerText=text;

resultBox.classList.remove("result-success","result-fail");

if(type==="success") resultBox.classList.add("result-success");
if(type==="fail") resultBox.classList.add("result-fail");

setTimeout(()=>{
resultBox.style.display="none";
},4000);

}

/* CAMERA */

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{video.srcObject=stream;})
.catch(()=>{statusText.innerText="Kamera tidak bisa diakses";});

/* LOAD MODEL */

async function loadModels(){

await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

statusText.innerText="Siap digunakan";

startFaceDetection();

}

loadModels();

/* DETECTION */

async function startFaceDetection(){

setInterval(async()=>{

const detection=await faceapi.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
);

if(detection){

faceFrame.classList.add("active");

const percent=Math.round(detection.score*100);

confidenceBox.innerText="Confidence "+percent+"%";
detectStatus.innerText="Wajah terdeteksi";

}else{

faceFrame.classList.remove("active");

confidenceBox.innerText="Confidence 0%";
detectStatus.innerText="Tidak ada wajah";

}

},400);

}

/* DESCRIPTOR */

async function getDescriptor(){

const detection=await faceapi
.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){

statusText.innerText="Wajah tidak terdeteksi";
return null;

}

return Array.from(detection.descriptor);

}

/* ENROLL */

async function enroll(){

const nama=document.getElementById("nama").value;

if(!nama){
statusText.innerText="Isi nama dulu";
return;
}

const descriptor=await getDescriptor();
if(!descriptor)return;

fetch(GAS_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
mode:"enroll",
nama:nama,
descriptor:descriptor
})
});

showResult("Wajah berhasil ditambahkan","success");

}

/* DISTANCE */

function euclideanDistance(d1,d2){

let sum=0;

for(let i=0;i<d1.length;i++){
sum+=Math.pow(d1[i]-d2[i],2);
}

return Math.sqrt(sum);

}

/* VERIFY */

async function verify(){

const descriptor=await getDescriptor();
if(!descriptor)return;

let response;

try{
response=await fetch(GAS_URL);
}catch{
statusText.innerText="Gagal koneksi server";
return;
}

let database;

try{
database=await response.json();
}catch{
statusText.innerText="Response bukan JSON valid";
return;
}

let bestMatch=null;
let minDistance=999;

database.forEach(user=>{

if(!user.descriptor)return;

const distance=euclideanDistance(descriptor,user.descriptor);

if(distance<minDistance){
minDistance=distance;
bestMatch=user.nama;
}

});

if(minDistance<0.6){

showResult("MATCH : "+bestMatch,"success");

}else{

showResult("Wajah tidak dikenali","fail");

}

}

</script>

</body>
</html>
