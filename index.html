<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Pro</title>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#0f172a;
  font-family:Arial, sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.video-wrapper{
  position:relative;
  flex:1;
  padding:15px;
  display:flex;
  justify-content:center;
  align-items:center;
}

video{
  width:100%;
  border-radius:20px;
  background:black;
}

.face-frame{
  position:absolute;
  width:220px;
  height:280px;
  border:3px solid #00e5ff;
  border-radius:20px;
  pointer-events:none;
  box-shadow:0 0 25px #00e5ff;
}

.controls{
  padding:20px;
  background:#111827;
  border-top-left-radius:25px;
  border-top-right-radius:25px;
}

input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:16px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
  cursor:pointer;
}

.enroll{background:#00c853;color:white;}
.verify{background:#2962ff;color:white;}

.status{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
  min-height:24px;
}

/* ================= LOADING ================= */

.loading-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  flex-direction:column;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid rgba(255,255,255,0.2);
  border-top:6px solid #00e5ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.loading-text{
  margin-top:15px;
  font-size:16px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Memproses...</div>
</div>

<div class="app">

  <div class="header">Face Recognition Pro</div>

  <div class="video-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <div class="face-frame"></div>
  </div>

  <div class="controls">
    <input type="text" id="nama" placeholder="Masukkan Nama">
    <button class="enroll" onclick="enroll()">Tambah Wajah</button>
    <button class="verify" onclick="verify()">Verifikasi</button>
    <div class="status" id="status">Loading model...</div>
  </div>

</div>

<script>

const video = document.getElementById("video");
const statusText = document.getElementById("status");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const GAS_URL = "https://script.google.com/macros/s/AKfycbwvBwwb_H4yp2gE6k97yabfPHAgd-IhLZMfVeX6iaqE6KUlxltdHCTGpc0tM9cIY6rj/exec";
const MODEL_URL = "./models";

/* ================= LOADING CONTROL ================= */

function showLoading(text){
  loading.style.display = "flex";
  loadingText.innerText = text;
}

function hideLoading(){
  loading.style.display = "none";
}

/* ================= CAMERA ================= */

navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
.then(stream => {
  video.srcObject = stream;
})
.catch(() => {
  statusText.innerText = "Kamera tidak bisa diakses";
});

/* ================= LOAD MODELS ================= */

async function loadModels(){
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  statusText.innerText = "Siap digunakan";
}

loadModels();

/* ================= GET DESCRIPTOR ================= */

async function getDescriptor(){

  statusText.innerText = "Mendeteksi wajah...";

  const detection = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    statusText.innerText = "Wajah tidak terdeteksi";
    hideLoading();
    return null;
  }

  return Array.from(detection.descriptor);
}

/* ================= ENROLL ================= */

async function enroll(){

  const nama = document.getElementById("nama").value;

  if (!nama){
    statusText.innerText = "Isi nama dulu";
    return;
  }

  showLoading("Menyimpan wajah...");

  const descriptor = await getDescriptor();
  if (!descriptor) return;

  await fetch(GAS_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      mode:"enroll",
      nama:nama,
      descriptor:descriptor
    })
  });

  hideLoading();
  statusText.innerText = "Wajah berhasil ditambahkan";
}

/* ================= DISTANCE ================= */

function euclideanDistance(d1,d2){
  let sum=0;
  for(let i=0;i<d1.length;i++){
    sum+=Math.pow(d1[i]-d2[i],2);
  }
  return Math.sqrt(sum);
}

/* ================= VERIFY ================= */

async function verify(){

  showLoading("Memverifikasi wajah...");

  const descriptor = await getDescriptor();
  if (!descriptor) return;

  let response;

  try{
    response = await fetch(GAS_URL);
  }catch{
    hideLoading();
    statusText.innerText = "Gagal koneksi server";
    return;
  }

  let database;

  try{
    database = await response.json();
  }catch{
    hideLoading();
    statusText.innerText = "Response bukan JSON valid";
    return;
  }

  if (!Array.isArray(database) || database.length === 0){
    hideLoading();
    statusText.innerText = "Database kosong";
    return;
  }

  let bestMatch = null;
  let minDistance = 999;

  database.forEach(user=>{
    if(!user.descriptor) return;

    const distance = euclideanDistance(descriptor,user.descriptor);

    if(distance < minDistance){
      minDistance = distance;
      bestMatch = user.nama;
    }
  });

  hideLoading();

  if(minDistance < 0.6){
    statusText.innerText = "MATCH: " + bestMatch;
  }else{
    statusText.innerText = "Tidak dikenali";
  }

}

</script>

</body>
</html>
