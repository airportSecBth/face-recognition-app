<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Pro</title>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

/* STYLE ANDA TIDAK DIUBAH */

*{box-sizing:border-box;}

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
}

.spinner{
width:60px;
height:60px;
border:6px solid #1e293b;
border-top:6px solid #00e5ff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.loadingText{
margin-top:15px;
color:#00e5ff;
}

.app{
width:100%;
max-width:500px;
min-height:100vh;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.tabs{
display:flex;
background:#020617;
}

.tab{
flex:1;
padding:14px;
text-align:center;
cursor:pointer;
border-bottom:3px solid transparent;
}

.tab.active{
border-bottom:3px solid #00e5ff;
background:#111827;
}

.video-wrapper{
position:relative;
flex:1;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
border-radius:20px;
background:black;
transform:scaleX(-1);
}

.face-frame{
position:absolute;
width:220px;
height:280px;
border:3px solid #00e5ff;
border-radius:20px;
pointer-events:none;
box-shadow:0 0 25px #00e5ff;
transition:0.3s;
}

.face-frame.active{
border:3px solid #00ff7b;
box-shadow:0 0 25px #00ff7b;
}

.frame-info{
position:absolute;
top:calc(50% + 160px);
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
font-size:14px;
background:rgba(0,0,0,0.6);
padding:8px 14px;
border-radius:10px;
border:1px solid #00e5ff;
}

#confidenceBox{
font-weight:bold;
color:#00e5ff;
}

#detectStatus{
font-size:13px;
color:#cbd5f5;
}

.result-box{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.85);
padding:10px 20px;
border-radius:12px;
font-weight:bold;
font-size:16px;
border:2px solid #00e5ff;
z-index:10;
display:none;
white-space:nowrap;
}

.result-success{
border-color:#00ff7b;
color:#00ff7b;
}

.result-fail{
border-color:#ff4d4d;
color:#ff4d4d;
}

.form-area{
padding:15px;
display:none;
flex-direction:column;
gap:10px;
}

input{
padding:12px;
border:none;
border-radius:10px;
font-size:15px;
}

button{
padding:14px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div id="loadingScreen">
<div class="spinner"></div>
<div class="loadingText">Loading AI Model...</div>
</div>

<div class="app">

<div class="header">Face Recognition Pro</div>

<div class="tabs">
<div class="tab active">Verifikasi</div>
<div class="tab">Tambah Wajah</div>
</div>

<div class="video-wrapper">

<div id="resultBox" class="result-box"></div>

<video id="video" autoplay muted playsinline></video>

<div class="face-frame" id="faceFrame"></div>

<div class="frame-info">
<div id="confidenceBox">Confidence 0%</div>
<div id="detectStatus">Tidak ada wajah</div>
</div>

</div>

</div>

<script>

const video=document.getElementById("video")
const faceFrame=document.getElementById("faceFrame")
const confidenceBox=document.getElementById("confidenceBox")
const detectStatus=document.getElementById("detectStatus")
const resultBox=document.getElementById("resultBox")

const MODEL_URL="./models"

let blinkState="open"
let blinkDetected=false

function eyeAspectRatio(eye){

const A=Math.hypot(eye[1].x-eye[5].x,eye[1].y-eye[5].y)
const B=Math.hypot(eye[2].x-eye[4].x,eye[2].y-eye[4].y)
const C=Math.hypot(eye[0].x-eye[3].x,eye[0].y-eye[3].y)

return (A+B)/(2*C)

}

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{video.srcObject=stream})

async function loadModels(){

await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL)
await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)

document.getElementById("loadingScreen").style.display="none"

startDetection()

}

loadModels()

const detectorOptions=new faceapi.TinyFaceDetectorOptions({inputSize:160})

async function startDetection(){

async function detect(){

const full=await faceapi
.detectSingleFace(video,detectorOptions)
.withFaceLandmarks()
.withFaceDescriptor()

if(full){

faceFrame.classList.add("active")

const percent=Math.round(full.detection.score*100)

confidenceBox.innerText="Confidence "+percent+"%"
detectStatus.innerText="Silakan kedipkan mata"

const leftEye=full.landmarks.getLeftEye()
const rightEye=full.landmarks.getRightEye()

const ear=(eyeAspectRatio(leftEye)+eyeAspectRatio(rightEye))/2

if(blinkState==="open" && ear<0.23){

blinkState="closed"

}

if(blinkState==="closed" && ear>0.27){

blinkDetected=true
blinkState="open"

}

/* BLINK VALID */

if(blinkDetected){

detectStatus.innerText="Blink terdeteksi"

blinkDetected=false

}

}else{

faceFrame.classList.remove("active")

confidenceBox.innerText="Confidence 0%"
detectStatus.innerText="Tidak ada wajah"

}

requestAnimationFrame(detect)

}

detect()

}

</script>

</body>
</html>
