<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Face Recognition Pro Auto</title>
<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
  margin:0;
}

.container{
  max-width:400px;
  margin:auto;
  padding:20px;
}

.video-wrapper{
  position:relative;
  display:inline-block;
}

video{
  border-radius:15px;
}

.frame{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:260px;
  border:3px solid #00ffcc;
  border-radius:50%;
  box-shadow:0 0 20px #00ffcc;
  pointer-events:none;
}

.status{
  margin-top:15px;
  font-weight:bold;
  font-size:18px;
}
</style>
</head>

<body>
<div class="container">

<h2>Face Recognition Auto Mode</h2>

<div class="video-wrapper">
  <video id="video" width="320" height="240" autoplay muted></video>
  <div class="frame"></div>
</div>

<div class="status" id="status">🔵 Loading Model...</div>

</div>

<script>

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const MODEL_URL = "./models";
const GAS_URL = "ISI_URL_GAS_KAMU";

let lastScanTime = 0;
let scanning = false;

navigator.mediaDevices.getUserMedia({ video:{} })
.then(stream => video.srcObject = stream);

async function loadModels(){
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  statusText.innerText = "🟡 Posisikan Wajah Anda";
  startAutoScan();
}

loadModels();

function distance(a,b){
  return Math.sqrt(
    Math.pow(a.x-b.x,2)+
    Math.pow(a.y-b.y,2)
  );
}

function getEAR(eye){
  const A = distance(eye[1],eye[5]);
  const B = distance(eye[2],eye[4]);
  const C = distance(eye[0],eye[3]);
  return (A+B)/(2*C);
}

async function startAutoScan(){

  setInterval(async ()=>{

    if(scanning) return;

    const detection = await faceapi
      .detectSingleFace(video,new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    if(!detection){
      statusText.innerText="🟡 Posisikan Wajah Anda";
      return;
    }

    statusText.innerText="🟡 Silakan Kedip";

    const leftEAR = getEAR(detection.landmarks.getLeftEye());
    const rightEAR = getEAR(detection.landmarks.getRightEye());
    const avgEAR = (leftEAR+rightEAR)/2;

    const now = Date.now();

    if(avgEAR < 0.22 && now - lastScanTime > 3000){

      scanning = true;
      lastScanTime = now;
      statusText.innerText="🔄 Memproses...";

      const descriptor = detection.descriptor;

      const response = await fetch(GAS_URL);
      const database = await response.json();

      let bestMatch=null;
      let minDistance=999;

      database.forEach(user=>{
        let sum=0;
        for(let i=0;i<descriptor.length;i++){
          sum+=Math.pow(descriptor[i]-user.descriptor[i],2);
        }
        const dist=Math.sqrt(sum);

        if(dist<minDistance){
          minDistance=dist;
          bestMatch=user.nama;
        }
      });

      if(minDistance<0.6){
        statusText.innerText="✅ MATCH: "+bestMatch;
      }else{
        statusText.innerText="❌ Tidak Dikenali";
      }

      setTimeout(()=>{
        scanning=false;
        statusText.innerText="🟡 Posisikan Wajah Anda";
      },3000);
    }

  },200);
}

</script>
</body>
</html>
