<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- WAJIB agar responsif di HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Face Recognition App</title>
<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}

h2{
  margin-top:10px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:15px 0;
  font-size:16px;
}

button{
  width:48%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:5px 1%;
}

.btn-enroll{
  background:#00c853;
  color:white;
}

.btn-verify{
  background:#2962ff;
  color:white;
}

.video-wrapper{
  position:relative;
  width:100%;
}

video{
  width:100%;
  height:auto;
  border-radius:15px;
  background:black;
}

@media (max-width:400px){
  button{
    width:100%;
    margin:8px 0;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>Face Recognition</h2>

<div class="video-wrapper">
  <video id="video" autoplay muted playsinline></video>
</div>

<input type="text" id="nama" placeholder="Masukkan Nama">

<div>
  <button class="btn-enroll" onclick="enroll()">Tambah Wajah</button>
  <button class="btn-verify" onclick="verify()">Verifikasi</button>
</div>

</div>

<script>

const video = document.getElementById("video");
const GAS_URL = "ISI_URL_GAS_KAMU";
const MODEL_URL = "./models";


// Kamera depan untuk HP
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user" }
})
.then(stream => video.srcObject = stream)
.catch(err => alert("Kamera tidak bisa diakses"));

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
}

loadModels();

async function getDescriptor() {
  const detection = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    alert("Wajah tidak terdeteksi");
    return null;
  }

  return Array.from(detection.descriptor);
}

async function enroll() {

  const nama = document.getElementById("nama").value;
  if (!nama) {
    alert("Isi nama dulu");
    return;
  }

  const descriptor = await getDescriptor();
  if (!descriptor) return;

  fetch(GAS_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      mode: "enroll",
      nama: nama,
      descriptor: descriptor
    })
  })
  .then(res => res.json())
  .then(() => alert("Data berhasil disimpan"));
}

function euclideanDistance(d1, d2) {
  let sum = 0;
  for (let i = 0; i < d1.length; i++) {
    sum += Math.pow(d1[i] - d2[i], 2);
  }
  return Math.sqrt(sum);
}

async function verify() {

  const descriptor = await getDescriptor();
  if (!descriptor) return;

  const response = await fetch(GAS_URL);
  const database = await response.json();

  let bestMatch = null;
  let minDistance = 999;

  database.forEach(user => {
    const distance = euclideanDistance(descriptor, user.descriptor);
    if (distance < minDistance) {
      minDistance = distance;
      bestMatch = user.nama;
    }
  });

  if (minDistance < 0.6) {
    alert("MATCH dengan: " + bestMatch);
  } else {
    alert("Tidak dikenali");
  }
}

</script>

</body>
</html>
