<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Ultra Fast</title>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:500px;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

/* VIDEO */

.video-wrapper{
position:relative;
flex:1;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
}

video{
width:100%;
border-radius:20px;
background:black;
transform:scaleX(-1);
}

/* FACE FRAME */

.face-frame{
position:absolute;
width:220px;
height:280px;
border:3px solid #00e5ff;
border-radius:20px;
box-shadow:0 0 25px #00e5ff;
transition:0.2s;
pointer-events:none;
}

.face-frame.active{
border:3px solid #00ff7b;
box-shadow:0 0 25px #00ff7b;
}

/* RESULT */

.result-box{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
background:#000;
padding:10px 20px;
border-radius:12px;
font-weight:bold;
border:2px solid #00e5ff;
display:none;
}

.result-success{
border-color:#00ff7b;
color:#00ff7b;
}

.result-fail{
border-color:#ff4d4d;
color:#ff4d4d;
}

/* INFO */

.info{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.6);
padding:6px 12px;
border-radius:10px;
font-size:13px;
text-align:center;
}

/* LOADING SCREEN */

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
}

.scan-box{
width:200px;
height:260px;
border:3px solid #00e5ff;
border-radius:20px;
position:relative;
overflow:hidden;
box-shadow:0 0 30px #00e5ff;
}

.scan-line{
position:absolute;
width:100%;
height:3px;
background:#00ff7b;
animation:scan 2s linear infinite;
}

@keyframes scan{

0%{top:0}

100%{top:100%}

}

.loading-text{
margin-top:20px;
font-size:16px;
color:#00e5ff;
}

</style>
</head>

<body>

<div class="loading-screen" id="loadingScreen">

<div class="scan-box">
<div class="scan-line"></div>
</div>

<div class="loading-text" id="loadingText">
Memuat AI Model...
</div>

</div>

<div class="app">

<div class="header">Face Recognition Ultra Fast</div>

<div class="video-wrapper">

<div id="resultBox" class="result-box"></div>

<video id="video" autoplay muted playsinline></video>

<div class="face-frame" id="faceFrame"></div>

<div class="info">
<div id="confidence">Confidence 0%</div>
<div id="status">Menunggu AI siap...</div>
</div>

</div>

</div>

<script>

const video=document.getElementById("video")
const faceFrame=document.getElementById("faceFrame")
const resultBox=document.getElementById("resultBox")
const confidenceBox=document.getElementById("confidence")
const statusBox=document.getElementById("status")

const loadingScreen=document.getElementById("loadingScreen")
const loadingText=document.getElementById("loadingText")

const GAS_URL="YOUR_GAS_URL"
const MODEL_URL="./models"

let database=[]
let descriptorCache=[]
let verifying=false

let frameCount=0
let lastBox=null

/* CAMERA */

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>{
video.srcObject=stream
})

/* RESULT */

function showResult(text,type){

resultBox.innerText=text
resultBox.style.display="block"

resultBox.classList.remove("result-success","result-fail")

if(type==="success") resultBox.classList.add("result-success")
if(type==="fail") resultBox.classList.add("result-fail")

setTimeout(()=>{

resultBox.style.display="none"

},3000)

}

/* LOAD MODELS */

async function loadModels(){

loadingText.innerText="Loading TinyFaceDetector..."

await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL)

loadingText.innerText="Loading Landmark Model..."

await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)

loadingText.innerText="Loading Recognition Model..."

await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)

loadingText.innerText="Loading Database..."

let res=await fetch(GAS_URL)
database=await res.json()

database.forEach(user=>{

descriptorCache.push({
nama:user.nama,
descriptor:new Float32Array(user.descriptor)
})

})

loadingText.innerText="AI Ready ✔"

/* HIDE LOADING */

setTimeout(()=>{

loadingScreen.style.display="none"
statusBox.innerText="AI siap - arahkan wajah"

startCamera()

},1000)

}

loadModels()

async function startCamera(){

await video.play()

detectLoop()

}

/* DETECTOR */

const detectorOptions=
new faceapi.TinyFaceDetectorOptions({
inputSize:128,
scoreThreshold:0.5
})

async function detectLoop(){

frameCount++

/* SKIP FRAME */

if(frameCount % 3 !==0){

requestAnimationFrame(detectLoop)
return

}

const detection=await faceapi.detectSingleFace(
video,
detectorOptions
).withFaceLandmarks().withFaceDescriptor()

if(detection){

faceFrame.classList.add("active")

const score=Math.round(detection.detection.score*100)

confidenceBox.innerText="Confidence "+score+"%"
statusBox.innerText="Wajah terdeteksi"

const box=detection.detection.box

if(lastBox){

box.x=(box.x+lastBox.x)/2
box.y=(box.y+lastBox.y)/2

}

lastBox=box

faceFrame.style.width=box.width+"px"
faceFrame.style.height=box.height+"px"
faceFrame.style.left=box.x+"px"
faceFrame.style.top=box.y+"px"

if(score>75){

verifyFace(detection.descriptor)

}

}else{

faceFrame.classList.remove("active")

confidenceBox.innerText="Confidence 0%"
statusBox.innerText="Tidak ada wajah"

}

requestAnimationFrame(detectLoop)

}

/* DISTANCE */

function fastDistance(d1,d2){

let sum=0

for(let i=0;i<128;i++){

let diff=d1[i]-d2[i]

sum+=diff*diff

}

return sum

}

/* VERIFY */

async function verifyFace(descriptor){

if(verifying) return

verifying=true

statusBox.innerText="Memverifikasi..."

let min=999
let best=null

const d1=new Float32Array(descriptor)

for(let i=0;i<descriptorCache.length;i++){

let dist=fastDistance(d1,descriptorCache[i].descriptor)

if(dist<min){

min=dist
best=descriptorCache[i].nama

}

}

if(min<0.45){

showResult("MATCH : "+best,"success")

}else{

showResult("Wajah tidak dikenali","fail")

}

setTimeout(()=>{

verifying=false

},2000)

}

</script>

</body>
</html>
